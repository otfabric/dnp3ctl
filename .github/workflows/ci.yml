# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      run-govulncheck: true
      coverage-min: "85"
      codecov-name: dnp3ctl
      go-versions: '["1.26", "1.27"]'
      # Test the cmd packages as well (the shared default skips /cmd) and attribute
      # coverage across the whole module, matching `make coverage`.
      test-exclude-regex: "/example(s)?($|/)"
      coverpkg: ./...
      fuzz-time: 10s
      # The golangci-lint `make check` runs (the shared default is v2.1.6).
      golangci-lint-version: v2.15.0
    secrets: inherit

  # go-ci gates the total; this gates each package (COVER_PKG_MIN).
  coverage-floor:
    name: Per-package coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check

  # The shared workflow builds for 64-bit only; linux/arm/v7 is a release target, where int
  # has 32 bits.
  cross:
    name: Typecheck for 32-bit targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross
