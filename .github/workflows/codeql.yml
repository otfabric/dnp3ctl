# CodeQL static analysis of the Go code, on pushes and pull requests to main and weekly.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - name: Build
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go test -tags=e2e -run '^$' ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
